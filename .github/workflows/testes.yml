# Confere o site e os gabaritos a cada mudança na main e em cada PR.
# - pytest: testes da plataforma (gerador do site, imagens, ênfase no Markdown...)
# - gabaritos: roda o código de cada gabarito das aulas (ferramentas/gabaritos/README.md)
# - código de Web, TypeScript, React e Java: sintaxe de JS/TS/TSX e compilação Java (testar_codigo.py)
# - build --strict: o site compila sem link quebrado
# Roda no Windows, o mesmo sistema do professor e dos alunos; os testes de
# Interfaces e Banco abrem janelas Tkinter por um instante.
name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Bibliotecas usadas pelos gabaritos do curso de Python
          pip install customtkinter==5.2.2 matplotlib
          # Bibliotecas usadas pelos gabaritos do curso de Automação com Python
          pip install openpyxl==3.1.5 python-docx==1.2.0 fpdf2==2.8.9 pillow==12.3.0 aiosmtpd==1.4.6 python-dotenv==1.2.1
          # Biblioteca usada pelos gabaritos do curso IA na prática com Python (os testes não chamam a API)
          pip install google-genai==2.34.0 pypdf==6.21.4

      - name: Testes da plataforma (pytest)
        run: python -m pytest -q

      - name: Gabaritos das aulas
        run: python ferramentas/gabaritos/testar.py

      # Código dos cursos de Web, TypeScript, React e Java (ferramentas/gabaritos/testar_codigo.py)
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Código de Web, TypeScript, React e Java
        run: |
          npm install --prefix "$env:RUNNER_TEMP\ts" typescript@5.6.3 --no-audit --no-fund
          $env:TYPESCRIPT_DIR = "$env:RUNNER_TEMP\ts\node_modules"
          python ferramentas/gabaritos/testar_codigo.py

      - name: Build do site (--strict)
        run: python -m mkdocs build --strict -f mkdocs/mkdocs.yml
