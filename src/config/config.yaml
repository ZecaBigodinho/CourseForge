# ============================================================
#  CourseForge — Configuração Global da Plataforma
# ============================================================

plataforma:
  nome: CourseForge
  versao: "1.0.0"
  autor_padrao: "Pedro Paulo IF"
  idioma: "pt-BR"

# Diretórios principais (relativos à raiz do projeto)
diretorios:
  cursos: cursos
  mkdocs_output: mkdocs
  templates: templates
  prompts: prompts

# Configurações do MkDocs gerado
mkdocs:
  site_name: "CourseForge · IF"
  site_description: "Cursos gratuitos para a sala de aula: Python para Desktop do zero ao sistema completo, com aulas práticas, revisão visual e projeto final."
  site_author: "Pedro Paulo IF"
  # Rodapé de todas as páginas (aceita HTML)
  copyright: 'Material gratuito para uso educacional · Prof. Pedro Paulo IF · <a href="mailto:pedropaulo4hire@gmail.com">pedropaulo4hire@gmail.com</a>'
  theme:
    name: material
    language: pt
    # Identidade visual: arquivos em cursos/assets/, cores definidas em stylesheets/custom.css
    logo: assets/logo.svg
    favicon: assets/favicon.svg
    palette:
      - media: "(prefers-color-scheme: light)"
        scheme: default
        primary: custom
        accent: custom
        toggle:
          icon: material/weather-night
          name: Mudar para o modo escuro
      - media: "(prefers-color-scheme: dark)"
        scheme: slate
        primary: custom
        accent: custom
        toggle:
          icon: material/weather-sunny
          name: Mudar para o modo claro
    font:
      text: Inter
      code: JetBrains Mono
    features:
      - navigation.tabs
      - navigation.sections
      - navigation.indexes
      - navigation.path
      - navigation.top
      - navigation.footer
      - toc.integrate
      - search.suggest
      - search.highlight
      - content.tabs.link
      - content.code.copy
  extra:
    generator: false
    social:
      - icon: fontawesome/brands/github
        link: https://github.com/ZecaBigodinho/curso-python
        name: Repositório no GitHub
      - icon: fontawesome/solid/envelope
        link: mailto:pedropaulo4hire@gmail.com
        name: Falar com o professor
  extra_css:
    - stylesheets/custom.css
  markdown_extensions:
    - admonition
    - pymdownx.details
    - pymdownx.superfences
    - pymdownx.tabbed:
        alternate_style: true
    - pymdownx.highlight:
        anchor_linenums: true
    - pymdownx.inlinehilite
    - pymdownx.snippets
    - attr_list
    - md_in_html
    - toc:
        permalink: true

# Numeração automática de módulos e capítulos
numeracao:
  modulos: true
  capitulos: true
  formato_modulo: "modulo_{:02d}"
  formato_capitulo: "{:02d}_{slug}"

# Configurações de prompt para IA
prompt:
  ia_padrao: "DeepSeek"
  idioma_saida: "pt-BR"
  nivel_padrao: "intermediário"
  palavras_minimas: 1500
