site_name: CourseForge · IF
site_description: 'Cursos gratuitos para a sala de aula: Python para Desktop do zero
  ao sistema completo, com aulas práticas, revisão visual e projeto final.'
site_author: Pedro Paulo IF
theme:
  name: material
  language: pt
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: custom
    accent: custom
    toggle:
      icon: material/weather-night
      name: Mudar para o modo escuro
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: custom
    accent: custom
    toggle:
      icon: material/weather-sunny
      name: Mudar para o modo claro
  font:
    text: Inter
    code: JetBrains Mono
  features:
  - navigation.tabs
  - navigation.sections
  - navigation.indexes
  - navigation.path
  - navigation.top
  - navigation.footer
  - toc.integrate
  - search.suggest
  - search.highlight
  - content.tabs.link
  - content.code.copy
site_url: https://zecabigodinho.github.io/CourseForge/
copyright: Material gratuito para uso educacional · Prof. Pedro Paulo IF · <a href="mailto:pedropaulo4hire@gmail.com">pedropaulo4hire@gmail.com</a>
extra:
  generator: false
  social:
  - icon: fontawesome/brands/github
    link: https://github.com/ZecaBigodinho/CourseForge
    name: Repositório no GitHub
  - icon: fontawesome/solid/envelope
    link: mailto:pedropaulo4hire@gmail.com
    name: Falar com o professor
extra_css:
- stylesheets/custom.css
extra_javascript:
- javascripts/home.js
- javascripts/abas.js
hooks:
- ../src/mkdocs_hooks/versao_css.py
plugins:
- search
- glightbox:
    touchNavigation: true
    loop: false
    skip_classes:
    - sem-zoom
markdown_extensions:
- admonition
- pymdownx.details
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.highlight:
    anchor_linenums: true
- pymdownx.inlinehilite
- pymdownx.tasklist:
    custom_checkbox: true
- pymdownx.snippets
- pymdownx.emoji:
    emoji_index: !!python/name:material.extensions.emoji.twemoji
    emoji_generator: !!python/name:material.extensions.emoji.to_svg
- attr_list
- md_in_html
- toc:
    permalink: true
