<svg xmlns="http://www.w3.org/2000/svg" width="480" height="350" viewBox="0 0 480 350" role="img" aria-hidden="true">
  <defs>
    <filter id="sombra" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <g filter="url(#sombra)">
    <rect x="10" y="6" width="460" height="330" rx="14" fill="#FFFFFF"/>
    <path d="M10 20 a14 14 0 0 1 14 -14 h432 a14 14 0 0 1 14 14 v18 h-460 z" fill="#EEEAFB"/>
  </g>
  <circle cx="30" cy="25" r="5" fill="#FF6B6B"/><circle cx="46" cy="25" r="5" fill="#FFC83D"/><circle cx="62" cy="25" r="5" fill="#4ADE80"/>
  <text x="240.0" y="29" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#4A3E86">Assistente de estudos</text>
  <g transform="translate(10 44)">

    <rect x="160" y="18" width="278" height="58" rx="14" fill="#4F35B5"/>
    <text x="176" y="42" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#fff">Me explique fotossíntese com um</text>
    <text x="176" y="62" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#fff">exemplo do dia a dia, em 3 frases.</text>
    <rect x="22" y="92" width="318" height="112" rx="14" fill="#F1EEFD"/>
    <text x="38" y="116" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#10202A">A planta funciona como uma cozinha:</text>
    <text x="38" y="136" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#10202A">usa a luz do sol como fogão, a água e o</text>
    <text x="38" y="156" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#10202A">gás carbônico como ingredientes e faz</text>
    <text x="38" y="176" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#10202A">açúcar, soltando oxigênio no ar.</text>
    <rect x="22" y="216" width="196" height="26" rx="13" fill="#E6FAF7"/>
    <text x="36" y="233" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="600" fill="#00796B">✓ Conferi no livro didático</text>
    <rect x="22" y="252" width="416" height="30" rx="15" fill="#fff" stroke="#DDD6FB"/>
    <text x="40" y="272" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#9A93C4">Escreva seu pedido (sem dados pessoais)…</text>

