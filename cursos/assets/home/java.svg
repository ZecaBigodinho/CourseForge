    <text x="64" y="100" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#E6E1FF">cadastro.<tspan fill="#82AAFF">cadastrar</tspan>(<tspan fill="#C3E88D">"Ana Souza"</tspan>);</text>
    <text x="18" y="100" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#6E6A8A" text-anchor="end">4</text>
    <text x="64" y="124" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#E6E1FF">cadastro.<tspan fill="#82AAFF">buscar</tspan>(<tspan fill="#F78C6C">1001</tspan>).<tspan fill="#82AAFF">adicionarNota</tspan>(<tspan fill="#F78C6C">9.5</tspan>);</text>
    <text x="18" y="124" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#6E6A8A" text-anchor="end">5</text>
    <text x="64" y="148" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" fill="#E6E1FF">System.out.<tspan fill="#82AAFF">println</tspan>(cadastro.<tspan fill="#82AAFF">todos</tspan>());</text>
    <text x="18" y="148" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" fill="#6E6A8A" text-anchor="end">6</text>
